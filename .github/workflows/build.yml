name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: bloom

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android project files
        run: |
          flutter create --platforms=android --org com.bloom.teens --project-name bloom .
          rm -f test/widget_test.dart

      - name: Set the app name on the phone
        run: sed -i 's/android:label="[^"]*"/android:label="Bloom"/' android/app/src/main/AndroidManifest.xml

      - name: Download packages
        run: flutter pub get

      - name: Check the code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build APK
        run: |
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk Bloom.apk

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Bloom-apk
          path: bloom/Bloom.apk

      - name: Publish APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Bloom build ${{ github.run_number }}
          files: bloom/Bloom.apk
